# .github/workflows/deploy.yml

name: Deploy wiki to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Installs uv and caches its downloads between runs.
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      # Reads zensical.toml and writes the site to site/, which wrangler.jsonc serves.
      # --locked installs the versions in uv.lock and fails if it is out of date with
      # pyproject.toml. --strict fails the build on warnings such as a nav entry with no page.
      - run: uv run --locked zensical build --strict --clean

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Deploys the Worker in wrangler.jsonc to wiki.alimahani.com.
      - run: npx wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
