# .github/workflows/deploy.yml

name: Deploy wiki to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: 3.x

      - run: pip install -r requirements.txt

      # Reads zensical.toml and writes the site to site/, which wrangler.jsonc serves.
      # --strict fails the build on warnings such as a nav entry with no page.
      - run: zensical build --strict --clean

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Deploys the Worker in wrangler.jsonc to wiki.alimahani.com.
      - run: npx wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
